services:
  - type: web
    name: a2a-invoice-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 45 main:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: BASE_URL
        sync: false
